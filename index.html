<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Números en Chino: Escucha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-RJ4G3BTCZ3"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', 'G-RJ4G3BTCZ3');
</script>
<style>
  :root{
    --paper:#F4EEE1;
    --paper-2:#ece3d0;
    --ink:#2B2620;
    --ink-soft:#5b5346;
    --seal:#B23A2E;
    --seal-dark:#8f2c22;
    --gold:#C9A227;
    --jade:#5c7a63;
    --line: rgba(43,38,32,0.14);
  }
  *{box-sizing:border-box;}
  html{ color-scheme: light; }
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(201,162,39,0.08), transparent),
      radial-gradient(900px 500px at 110% 10%, rgba(178,58,46,0.06), transparent),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:720px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Top bar ---------- */
  #topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  #topbar .brand{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.08em;
    color:var(--ink-soft);
  }
  #timerWrap{
    display:flex;
    align-items:center;
    gap:10px;
  }
  #timerBadge{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:20px;
    background:var(--ink);
    color:var(--paper);
    padding:5px 12px;
    border-radius:3px;
    letter-spacing:0.04em;
    min-width:68px;
    text-align:center;
  }
  #timerBadge.urgent{ background:var(--seal); }
  #backBtn{
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-family:'Noto Sans TC',sans-serif;
    font-size:13px;
    padding:7px 12px;
    border-radius:3px;
    cursor:pointer;
    visibility:hidden;
  }
  #backBtn:hover{ border-color:var(--ink-soft); color:var(--ink); }

  #timerTrack{
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:2px;
    background:var(--line);
  }
  #timerFill{
    height:100%;
    background:var(--gold);
    width:100%;
    transition:width 1s linear;
  }
  #timerFill.urgent{ background:var(--seal); }

  /* ---------- Screens ---------- */
  main#stage{
    flex:1;
    display:flex;
    flex-direction:column;
  }
  .screen{ display:none; flex:1; flex-direction:column; }
  .screen.active{ display:flex; }

  /* ---------- Menu ---------- */
  #menuScreen{
    align-items:center;
    justify-content:center;
    padding:40px 24px;
    text-align:center;
    gap:8px;
  }
  #menuScreen h1{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:clamp(28px,6vw,40px);
    margin:0 0 6px;
    letter-spacing:0.02em;
  }
  #menuScreen .sub{
    color:var(--ink-soft);
    font-size:14px;
    margin:0 0 34px;
  }
  .modeCards{
    display:flex;
    justify-content:center;
    width:100%;
  }
  .modeCard{
    max-width:420px;
    text-align:left;
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:22px 20px;
    cursor:pointer;
    font-family:inherit;
    color:var(--ink);
    position:relative;
    overflow:hidden;
    transition:transform .15s ease, border-color .15s ease;
  }
  .modeCard:hover{ transform:translateY(-2px); border-color:var(--gold); }
  .modeCard:focus-visible{ outline:2px solid var(--seal); outline-offset:2px; }
  .modeCard .modeNum{
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--gold);
    letter-spacing:0.1em;
    display:block;
    margin-bottom:10px;
  }
  .modeCard h2{
    font-family:'Noto Serif TC', serif;
    font-size:22px;
    margin:0 0 8px;
  }
  .modeCard p{
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.6;
    margin:0;
  }
  .modeNotice{
    font-size:12px;
    color:var(--ink-soft);
    text-align:center;
    margin:14px 20px 0;
    line-height:1.5;
  }

  /* 答錯時的訂正：中文 + 拼音 */
  .feedback.withCorrection{ flex-direction:column; gap:6px; padding:6px 20px 2px; }
  .fbRow{ display:flex; align-items:center; justify-content:center; gap:10px; }
  .fbRow .msg{ text-align:center; }
  .fbRow .stamp{ flex-shrink:0; }
  .feedback.withCorrection{ margin-bottom:10px; }
  .correction{ display:flex; flex-direction:column; align-items:center; gap:2px; }
  .corrHanzi{ font-family:'Noto Serif TC', serif; font-weight:700; font-size:26px; color:var(--ink); letter-spacing:0.08em; }
  .corrPinyin{ font-size:14px; color:var(--ink-soft); letter-spacing:0.02em; }

  /* 結果頁：答錯的數字 */
  .wrongBreakdown{
    display:none;
    width:100%;
    max-width:380px;
    margin:0 auto 30px;
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px 20px;
    text-align:left;
  }
  .wrongRow{ display:flex; align-items:baseline; gap:14px; padding:6px 0; border-bottom:1px dashed var(--line); }
  .wrongRow:last-of-type{ border-bottom:none; }
  .wrongNum{ font-family:'Space Mono', monospace; font-weight:700; font-size:16px; min-width:52px; }
  .wrongText{ display:flex; flex-direction:column; min-width:0; }
  .wrongCn{ font-family:'Noto Serif TC', serif; font-weight:700; font-size:17px; }
  .wrongPy{ font-size:12px; color:var(--ink-soft); }
  .wrongMore{ font-size:12px; color:var(--ink-soft); text-align:center; margin-top:6px; }

  .voiceNotice{
    background:#fbe9c9;
    border:1px solid var(--gold);
    border-radius:6px;
    padding:8px 12px;
    color:#5a4300;
  }
  .voiceNotice[hidden]{ display:none; }

  /* ---------- Number stage (shared) ---------- */
  .numberStage{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    position:relative;
  }
  .numberCard{
    background:#ffffff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:28px 24px;
    box-shadow:0 2px 10px rgba(43,38,32,0.06);
    display:flex;
    flex-direction:column;
    align-items:center;
    width:min(92%, 420px);
  }
  #listenInput{
    font-family:'Space Mono', monospace;
    font-size:clamp(40px,12vw,64px);
    font-weight:700;
    text-align:center;
    width:100%;
    background:#ffffff;
    background-color:#ffffff;
    border:none;
    border-bottom:3px solid var(--ink);
    color:#1a1611 !important;
    -webkit-text-fill-color:#1a1611;
    opacity:1;
    -webkit-appearance:none;
    appearance:none;
    caret-color:var(--seal);
    padding:10px 4px;
    letter-spacing:0.05em;
  }
  #listenInput:focus{ outline:none; border-color:var(--seal); }
  #listenInput::placeholder{ font-size:15px; font-family:'Noto Sans TC',sans-serif; color:#a39d8d; -webkit-text-fill-color:#a39d8d; letter-spacing:normal; }

  #confirmBtn{
    margin-top:20px;
    width:100%;
    max-width:220px;
    background:var(--seal);
    color:#fff;
    border:none;
    font-family:'Noto Sans TC',sans-serif;
    font-weight:700;
    font-size:16px;
    padding:12px 20px;
    border-radius:24px;
    cursor:pointer;
    letter-spacing:0.05em;
  }
  #confirmBtn:hover{ background:var(--seal-dark); }
  #confirmBtn:active{ transform:translateY(1px); }

  .feedback{
    min-height:46px;
    text-align:center;
    font-size:16px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .feedback .stamp{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:34px; height:34px;
    border-radius:50%;
    font-size:20px;
    transform:rotate(-8deg) scale(0.4);
    opacity:0;
    animation:stampIn .28s ease-out forwards;
  }
  .feedback.correct .stamp{ border:2.5px solid var(--seal); color:var(--seal); }
  .feedback.wrong .stamp{ border:2.5px solid var(--ink); color:var(--ink); }
  .feedback.correct .msg{ color:var(--seal-dark); }
  .feedback.wrong .msg{ color:var(--ink-soft); }
  @keyframes stampIn{
    0%{ transform:rotate(-8deg) scale(0.4); opacity:0; }
    60%{ transform:rotate(-8deg) scale(1.15); opacity:1; }
    100%{ transform:rotate(-8deg) scale(1); opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
    .feedback .stamp{ animation:none; opacity:1; transform:rotate(-8deg) scale(1); }
  }

  #speedSelector{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    padding:16px 20px 0;
  }
  .speedBtn{
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-family:'Noto Sans TC',sans-serif;
    font-size:13px;
    padding:7px 16px;
    border-radius:20px;
    cursor:pointer;
  }
  .speedBtn:hover{ border-color:var(--gold); color:var(--ink); }
  .speedBtn.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
    font-weight:700;
  }

  #replayBtn{
    margin:0 auto 30px;
    display:block;
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-family:'Noto Sans TC',sans-serif;
    font-size:13px;
    padding:8px 16px;
    border-radius:20px;
    cursor:pointer;
  }
  #replayBtn:hover{ border-color:var(--gold); color:var(--ink); }

  /* ---------- Result ---------- */
  #resultScreen{
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 24px;
    gap:6px;
  }
  #resultTitle{
    font-family:'Noto Serif TC', serif;
    font-size:28px;
    margin:0 0 24px;
  }
  .resultStats{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:34px;
  }
  .statCard{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:18px 26px;
    min-width:100px;
  }
  .statCard .num{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:32px;
  }
  .statCard.correct .num{ color:var(--seal); }
  .statCard.wrong .num{ color:var(--ink-soft); }
  .statCard .label{ font-size:12px; color:var(--ink-soft); margin-top:4px; }
  .speedBreakdown{
    display:none;
    width:100%;
    max-width:280px;
    margin:0 auto 30px;
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px 20px;
  }
  .speedBreakdownTitle{
    font-size:12px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-bottom:8px;
    text-align:center;
  }
  .speedRow{
    display:flex;
    justify-content:space-between;
    font-family:'Space Mono', monospace;
    font-size:14px;
    padding:5px 0;
    border-bottom:1px dashed var(--line);
  }
  .speedRow:last-child{ border-bottom:none; }
  .resultActions{ display:flex; gap:12px; }
  .resultActions button{
    font-family:'Noto Sans TC',sans-serif;
    font-size:14px;
    padding:10px 20px;
    border-radius:20px;
    cursor:pointer;
    border:1px solid var(--ink);
    background:none;
    color:var(--ink);
  }
  #retryBtn{ background:var(--ink); color:var(--paper); }
  #retryBtn:hover{ background:var(--seal-dark); border-color:var(--seal-dark); }
  #menuBtn:hover{ border-color:var(--gold); color:var(--ink); }

  /* ---------- ⚙️ 設定（和小狗找寶藏一樣） ---------- */
  .topRight{display:flex;align-items:center;gap:8px;}
  .gear{width:36px;height:36px;padding:0;border-radius:999px;cursor:pointer;border:1.5px solid var(--gold);background:var(--paper-2);color:var(--ink);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .ov{position:fixed;inset:0;z-index:1200;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(46,36,28,.55);overflow-y:auto;}
  .ov.hide{display:none;}
  .ovCard{width:100%;max-width:380px;margin:auto;background:var(--paper);border:2px solid var(--gold);border-radius:20px;padding:18px 16px;text-align:center;}
  .ovCard h2{margin:0 0 10px;color:var(--seal-dark);font-family:'Noto Serif TC',serif;font-size:20px;}
  .setGroup{margin:12px 0;text-align:left;}
  .setGroup h3{font-size:13px;margin:0 0 6px;color:var(--seal-dark);}
  .setGroup h3 small{font-size:11px;font-weight:400;color:var(--ink-soft);}
  .setGroup h3 small::before{content:" · ";}
  .opts{display:flex;flex-wrap:wrap;gap:6px;}
  .opt{flex:1 1 0;min-width:0;padding:7px 8px;border-radius:999px;border:1.5px solid var(--gold);background:#fff;color:var(--ink);font-family:inherit;font-size:14px;cursor:pointer;line-height:1.25;}
  .opt small{display:block;font-size:10.5px;opacity:.8;}
  .opts.two .opt{flex:1 1 40%;}
  .opt.on{background:var(--gold);color:#2E241C;font-weight:700;}
  #setDone{margin-top:6px;padding:10px 26px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-size:15px;cursor:pointer;}
  .corrPinyin.zy{letter-spacing:.06em;}
  .tr{font-size:.82em;opacity:.8;}
  .wrongPy + .wrongPy{display:block;}
</style>
</head>
<body>
<div id="setov" class="ov hide"></div>
<div id="app">

  <header id="topbar">
    <div class="brand" data-t="brand"></div>
    <div id="timerWrap">
      <div id="timerBadge">01:00</div>
    </div>
    <div class="topRight"><button type="button" class="gear" id="gearBtn" aria-label="⚙️">⚙️</button><button id="backBtn" data-t="back"></button></div>
    <div id="timerTrack"><div id="timerFill"></div></div>
  </header>

  <main id="stage">

    <!-- Menu -->
    <section id="menuScreen" class="screen active">
      <h1 data-t="h1"></h1>
      <p class="sub" data-t="sub"></p>
      <div class="modeCards">
        <button class="modeCard" id="startListening" type="button">
          <span class="modeNum" data-t="mode1"></span>
          <h2 data-t="modeName"></h2>
          <p data-t="modeDesc"></p>
        </button>
      </div>
    </section>

    <!-- Listening -->
    <section id="listeningScreen" class="screen">
      <p class="modeNotice" data-t="synthNote"></p>
      <p class="modeNotice voiceNotice" id="voiceNotice" role="status" hidden data-t="noVoice"></p>
      <div id="speedSelector" role="group" aria-label="語速">
        <button class="speedBtn" type="button" data-rate="slow" data-t="slow"></button>
        <button class="speedBtn" type="button" data-rate="normal" data-t="normal"></button>
        <button class="speedBtn" type="button" data-rate="fast" data-t="fast"></button>
      </div>
      <div class="numberStage">
        <div class="numberCard">
          <input id="listenInput" type="text" inputmode="numeric" autocomplete="off" data-tp="ph">
          <button id="confirmBtn" type="button"></button>
        </div>
      </div>
      <div id="listenFeedback" class="feedback"></div>
      <button id="replayBtn" type="button" data-t="replay"></button>
    </section>

    <!-- Result -->
    <section id="resultScreen" class="screen">
      <h2 id="resultTitle" data-t="timeUp"></h2>
      <div class="resultStats" id="resultStats"></div>
      <div class="speedBreakdown" id="speedBreakdown"></div>
      <div class="wrongBreakdown" id="wrongBreakdown"></div>
      <div class="resultActions">
        <button id="retryBtn" type="button" data-t="again"></button>
        <button id="menuBtn" type="button" data-t="back"></button>
      </div>
    </section>

  </main>
</div>

<script>
(function(){
  "use strict";

  /* ============ Analytics (GA4) ============ */
  function trackEvent(name, params){
    if (typeof gtag === 'function'){
      gtag('event', name, params || {});
    }
  }


  /* ============ 共用設定（和小狗找寶藏同一份 hanziGames.settings） ============ */
  const SETTINGS_KEY = 'hanziGames.settings';
  const SET_OPTS = { script:['trad','simp'], lang:['es','en','zh'], phon:['pinyin','zhuyin','both','off'], rate:['slow','normal','fast'] };
  const RATE_VALUE = { slow:0.45, normal:0.65, fast:0.85 };
  function writeSettings(o){
    try{
      let cur = {};
      try{ cur = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}') || {}; }catch(e){}
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(Object.assign(cur, { v:1, script:o.script, lang:o.lang, phon:o.phon, rate:o.rate })));
    }catch(e){}
  }
  function readSettings(){
    const out = { v:1, script:'trad', lang:'es', phon:'pinyin', rate:'normal' };
    let saved = null;
    try{ saved = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null'); }catch(e){}
    if (saved && typeof saved === 'object'){
      Object.keys(SET_OPTS).forEach(k => { if (SET_OPTS[k].includes(saved[k])) out[k] = saved[k]; });
    } else writeSettings(out);
    return out;
  }
  const Settings = readSettings();
  const saveSettings = () => writeSettings(Settings);
  const SIMP = () => Settings.script === 'simp';
  const ONLYZH = () => Settings.lang === 'zh';
  const esc = x => String(x).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let _t2s = null;
  const Z = x => (SIMP() && _t2s) ? _t2s(String(x)) : String(x);
  function loadT2S(){
    if (_t2s) return Promise.resolve();
    return new Promise(res => {
      const sc = document.createElement('script');
      sc.src = 'https://cdn.jsdelivr.net/npm/opencc-js@1.4.2/dist/umd/t2cn.js';
      sc.onload = () => { try { _t2s = OpenCC.Converter({ from: 'tw', to: 'cn' }); } catch (e) {} res(); };
      sc.onerror = () => res();
      document.head.appendChild(sc);
    });
  }
  /* 拼音 → 注音 */
  const ZY=(function(){
  var INI={b:'ㄅ',p:'ㄆ',m:'ㄇ',f:'ㄈ',d:'ㄉ',t:'ㄊ',n:'ㄋ',l:'ㄌ',g:'ㄍ',k:'ㄎ',h:'ㄏ',j:'ㄐ',q:'ㄑ',x:'ㄒ',zh:'ㄓ',ch:'ㄔ',sh:'ㄕ',r:'ㄖ',z:'ㄗ',c:'ㄘ',s:'ㄙ'};
  var FIN={a:'ㄚ',o:'ㄛ',e:'ㄜ',ê:'ㄝ',ai:'ㄞ',ei:'ㄟ',ao:'ㄠ',ou:'ㄡ',an:'ㄢ',en:'ㄣ',ang:'ㄤ',eng:'ㄥ',er:'ㄦ',
    i:'ㄧ',ia:'ㄧㄚ',io:'ㄧㄛ',ie:'ㄧㄝ',iao:'ㄧㄠ',iu:'ㄧㄡ',iou:'ㄧㄡ',ian:'ㄧㄢ',in:'ㄧㄣ',iang:'ㄧㄤ',ing:'ㄧㄥ',
    u:'ㄨ',ua:'ㄨㄚ',uo:'ㄨㄛ',uai:'ㄨㄞ',ui:'ㄨㄟ',uei:'ㄨㄟ',uan:'ㄨㄢ',un:'ㄨㄣ',uen:'ㄨㄣ',uang:'ㄨㄤ',ong:'ㄨㄥ',ueng:'ㄨㄥ',
    v:'ㄩ',ve:'ㄩㄝ',van:'ㄩㄢ',vn:'ㄩㄣ',iong:'ㄩㄥ'};
  var MARK=['','','ˊ','ˇ','ˋ'];
  function one(syl){
    var s=syl.normalize('NFD'),tone=5;
    if(/̄/.test(s))tone=1;else if(/́/.test(s))tone=2;else if(/̌/.test(s))tone=3;else if(/̀/.test(s))tone=4;
    s=s.replace(/ü/g,'v').replace(/ü/g,'v').replace(/Ü/g,'v').replace(/[̀-ͯ]/g,'').toLowerCase();
    if(!/^[a-zê]+$/.test(s))return syl;
    var ini='',rest=s,m;
    if(s==='n'||s==='m'){var zz=s==='n'?'ㄣ':'ㄇㄨ';return tone===5?'˙'+zz:zz+MARK[tone];}
    if(s==='er'||s==='r'){rest='er';}
    else if((m=s.match(/^(zh|ch|sh|[bpmfdtnlgkhjqxrzcs])/))){ini=m[1];rest=s.slice(ini.length);}
    else if(s[0]==='y'){rest=s.slice(1);if(/^u/.test(rest))rest=rest.replace(/^u/,'v');else if(!(rest==='i'||rest==='in'||rest==='ing'))rest='i'+rest;}
    else if(s[0]==='w'){rest=s.slice(1);rest=(rest==='u')?'u':'u'+rest;}

  function markSyl(base, tone){
    if (tone === 5) return base;
    const M = { a:'āáǎà', e:'ēéěè', i:'īíǐì', o:'ōóǒò', u:'ūúǔù' };

    if (idx < 0) { for (let i = base.length - 1; i >= 0; i--) if ('iou'.includes(base[i])) { idx = i; break; } }

    const out = chars.map((c, i) => {
      let t = tones[i];
      const next = i + 1 < chars.length ? tones[i + 1] : 0;
      if (c === '一' && next){ t = next === 4 ? 2 : 4; }          // 一＋四聲→yí，其餘→yì
      else if (t === 3 && next === 3){ t = 2; }                    // 三聲＋三聲→二聲
      return markSyl(NUM_SYL[c][0], t);

  const CN_DIGIT = ['零','一','二','三','四','五','六','七','八','九'];

  function numberToChinese(n){
    if (n === 0) return '零';
    const s = String(n);
    const len = s.length;
    let result = '';
    let needZero = false;
    for (let i=0; i<len; i++){
      const d = parseInt(s[i], 10);
      const unitPos = len - i - 1;
      if (d === 0){
        needZero = true;
        continue;
      }
      if (needZero){
        result += '零';
        needZero = false;
      }
      let digitChar = CN_DIGIT[d];
      if (d === 2 && unitPos >= 2) digitChar = '兩'; // 兩百 / 兩千
      if (d === 1 && unitPos === 1 && result === '') digitChar = ''; // 十 not 一十 at the start

  ];
  const DIGIT_RANGES_TOTAL = DIGIT_RANGES.reduce((sum, r) => sum + r.weight, 0);

    let r = Math.random() * DIGIT_RANGES_TOTAL;
    for (const range of DIGIT_RANGES){

    }
    return DIGIT_RANGES[DIGIT_RANGES.length - 1];

  window.addEventListener('storage', e => {
    if (e.key !== SETTINGS_KEY) return;
    Object.assign(Settings, readSettings());
    if (SIMP() && !_t2s) loadT2S().then(refreshAll); else refreshAll();
  });
  if (SIMP()) loadT2S().then(applyUI);
  applyUI();

  /* ============ Nav ============ */
  el('startListening').addEventListener('click', () => {
    trackEvent('select_mode', { mode: 'listening' });
    startListeningMode();
  });
  backBtn.addEventListener('click', returnToMenu);
  el('menuBtn').addEventListener('click', returnToMenu);
  el('retryBtn').addEventListener('click', () => {
    trackEvent('replay_game', { mode: currentMode });
    startListeningMode();
  });

  trackEvent('enter_main_menu');

})();
</script>
</body>
</html>
