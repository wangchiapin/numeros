<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Números en Chino: Escucha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  gtag('js', new Date());

<style>
  :root{
    --paper:#F4EEE1;
    --paper-2:#ece3d0;
    --ink:#2B2620;
    --ink-soft:#5b5346;
    --seal:#B23A2E;
    --seal-dark:#8f2c22;
    --gold:#C9A227;
    --jade:#5c7a63;
    --line: rgba(43,38,32,0.14);
  }
  *{box-sizing:border-box;}
  html{ color-scheme: light; }
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(201,162,39,0.08), transparent),
      radial-gradient(900px 500px at 110% 10%, rgba(178,58,46,0.06), transparent),
      var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    max-width:720px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- Top bar ---------- */
  #topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 20px;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  #topbar .brand{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.08em;
    color:var(--ink-soft);
  }
  #timerWrap{
    display:flex;
    align-items:center;
    gap:10px;
  }
  #timerBadge{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:20px;
    background:var(--ink);
    color:var(--paper);
    padding:5px 12px;
    border-radius:3px;
    letter-spacing:0.04em;
    min-width:68px;
    text-align:center;
  }
  #timerBadge.urgent{ background:var(--seal); }
  #backBtn{
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-family:'Noto Sans TC',sans-serif;
    font-size:13px;
    padding:7px 12px;
    border-radius:3px;
    cursor:pointer;
    visibility:hidden;
  }
  #backBtn:hover{ border-color:var(--ink-soft); color:var(--ink); }

  #timerTrack{
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:2px;
    background:var(--line);
  }
  #timerFill{
    height:100%;
    background:var(--gold);
    width:100%;
    transition:width 1s linear;
  }
  #timerFill.urgent{ background:var(--seal); }

  /* ---------- Screens ---------- */
  main#stage{
    flex:1;
    display:flex;
    flex-direction:column;
  }
  .screen{ display:none; flex:1; flex-direction:column; }
  .screen.active{ display:flex; }

  /* ---------- Menu ---------- */
  #menuScreen{
    align-items:center;
    justify-content:center;
    padding:40px 24px;
    text-align:center;
    gap:8px;
  }
  #menuScreen h1{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:clamp(28px,6vw,40px);
    margin:0 0 6px;
    letter-spacing:0.02em;
  }
  #menuScreen .sub{
    color:var(--ink-soft);
    font-size:14px;
    margin:0 0 34px;
  }
  .modeCards{
    display:flex;
    justify-content:center;
    width:100%;
  }
  .modeCard{
    max-width:420px;
    text-align:left;
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:22px 20px;
    cursor:pointer;
    font-family:inherit;
    color:var(--ink);
    position:relative;
    overflow:hidden;
    transition:transform .15s ease, border-color .15s ease;
  }
  .modeCard:hover{ transform:translateY(-2px); border-color:var(--gold); }
  .modeCard:focus-visible{ outline:2px solid var(--seal); outline-offset:2px; }
  .modeCard .modeNum{
    font-family:'Space Mono', monospace;
    font-size:12px;
    color:var(--gold);
    letter-spacing:0.1em;
    display:block;
    margin-bottom:10px;
  }
  .modeCard h2{
    font-family:'Noto Serif TC', serif;
    font-size:22px;
    margin:0 0 8px;
  }
  .modeCard p{
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.6;
    margin:0;
  }
  .modeNotice{
    font-size:12px;
    color:var(--ink-soft);
    text-align:center;
    margin:14px 20px 0;
    line-height:1.5;
  }

  /* ---------- Number stage (shared) ---------- */
  .numberStage{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    position:relative;
  }
  .numberCard{
    background:#ffffff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:28px 24px;
    box-shadow:0 2px 10px rgba(43,38,32,0.06);
    display:flex;
    flex-direction:column;
    align-items:center;
    width:min(92%, 420px);
  }
  #listenInput{
    font-family:'Space Mono', monospace;
    font-size:clamp(40px,12vw,64px);
    font-weight:700;
    text-align:center;
    width:100%;
    background:#ffffff;
    background-color:#ffffff;
    border:none;
    border-bottom:3px solid var(--ink);
    color:#1a1611 !important;
    -webkit-text-fill-color:#1a1611;
    opacity:1;
    -webkit-appearance:none;
    appearance:none;
    caret-color:var(--seal);
    padding:10px 4px;
    letter-spacing:0.05em;
  }
  #listenInput:focus{ outline:none; border-color:var(--seal); }
  #listenInput::placeholder{ font-size:15px; font-family:'Noto Sans TC',sans-serif; color:#a39d8d; -webkit-text-fill-color:#a39d8d; letter-spacing:normal; }

  #confirmBtn{
    margin-top:20px;
    width:100%;
    max-width:220px;
    background:var(--seal);
    color:#fff;
    border:none;
    font-family:'Noto Sans TC',sans-serif;
    font-weight:700;
    font-size:16px;
    padding:12px 20px;
    border-radius:24px;
    cursor:pointer;
    letter-spacing:0.05em;
  }
  #confirmBtn:hover{ background:var(--seal-dark); }
  #confirmBtn:active{ transform:translateY(1px); }

  .feedback{
    min-height:46px;
    text-align:center;
    font-size:16px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .feedback .stamp{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:34px; height:34px;
    border-radius:50%;
    font-size:20px;
    transform:rotate(-8deg) scale(0.4);
    opacity:0;
    animation:stampIn .28s ease-out forwards;
  }
  .feedback.correct .stamp{ border:2.5px solid var(--seal); color:var(--seal); }
  .feedback.wrong .stamp{ border:2.5px solid var(--ink); color:var(--ink); }
  .feedback.correct .msg{ color:var(--seal-dark); }
  .feedback.wrong .msg{ color:var(--ink-soft); }
  @keyframes stampIn{
    0%{ transform:rotate(-8deg) scale(0.4); opacity:0; }
    60%{ transform:rotate(-8deg) scale(1.15); opacity:1; }
    100%{ transform:rotate(-8deg) scale(1); opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
    .feedback .stamp{ animation:none; opacity:1; transform:rotate(-8deg) scale(1); }
  }

  #speedSelector{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    padding:16px 20px 0;
  }
  .speedBtn{
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-family:'Noto Sans TC',sans-serif;
    font-size:13px;
    padding:7px 16px;
    border-radius:20px;
    cursor:pointer;
  }
  .speedBtn:hover{ border-color:var(--gold); color:var(--ink); }
  .speedBtn.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
    font-weight:700;
  }

  #replayBtn{
    margin:0 auto 30px;
    display:block;
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-family:'Noto Sans TC',sans-serif;
    font-size:13px;
    padding:8px 16px;
    border-radius:20px;
    cursor:pointer;
  }
  #replayBtn:hover{ border-color:var(--gold); color:var(--ink); }

  /* ---------- Result ---------- */
  #resultScreen{
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 24px;
    gap:6px;
  }
  #resultTitle{
    font-family:'Noto Serif TC', serif;
    font-size:28px;
    margin:0 0 24px;
  }
  .resultStats{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:34px;
  }
  .statCard{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:18px 26px;
    min-width:100px;
  }
  .statCard .num{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:32px;
  }
  .statCard.correct .num{ color:var(--seal); }
  .statCard.wrong .num{ color:var(--ink-soft); }
  .statCard .label{ font-size:12px; color:var(--ink-soft); margin-top:4px; }
  .speedBreakdown{
    display:none;
    width:100%;
    max-width:280px;
    margin:0 auto 30px;
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px 20px;
  }
  .speedBreakdownTitle{
    font-size:12px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-bottom:8px;
    text-align:center;
  }
  .speedRow{
    display:flex;
    justify-content:space-between;
    font-family:'Space Mono', monospace;
    font-size:14px;
    padding:5px 0;
    border-bottom:1px dashed var(--line);
  }
  .speedRow:last-child{ border-bottom:none; }
  .resultActions{ display:flex; gap:12px; }
  .resultActions button{
    font-family:'Noto Sans TC',sans-serif;
    font-size:14px;
    padding:10px 20px;
    border-radius:20px;
    cursor:pointer;
    border:1px solid var(--ink);
    background:none;
    color:var(--ink);
  }
  #retryBtn{ background:var(--ink); color:var(--paper); }
  #retryBtn:hover{ background:var(--seal-dark); border-color:var(--seal-dark); }
  #menuBtn:hover{ border-color:var(--gold); color:var(--ink); }
</style>
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand">Números en Chino: Escucha</div>
    <div id="timerWrap">
      <div id="timerBadge">01:00</div>
    </div>
    <button id="backBtn">Volver al menú</button>
    <div id="timerTrack"><div id="timerFill"></div></div>
  </header>

  <main id="stage">

    <!-- Menu -->
    <section id="menuScreen" class="screen active">
      <h1>Práctica Rápida de Números en Chino</h1>
      <p class="sub">Cada ronda dura 1 minuto · Números del 0 al 9999</p>
      <div class="modeCards">
        <button class="modeCard" id="startListening" type="button">
          <span class="modeNum">MODO 01</span>
          <h2>Modo Escucha</h2>
          <p>El sistema dirá un número en chino. Escribe el número que escuchaste y pulsa Enter (o el botón Confirmar). Pasarás a la siguiente pregunta sin importar si aciertas o no.</p>
        </button>
      </div>
    </section>

    <!-- Listening -->
    <section id="listeningScreen" class="screen">
      <p class="modeNotice">ℹ️ La voz la genera el navegador (síntesis de voz), así que a veces puede sonar un poco robótica o rara.</p>
      <div id="speedSelector" role="group" aria-label="Selección de velocidad">
        <button class="speedBtn" type="button" data-rate="0.1">Súper Fácil</button>
        <button class="speedBtn" type="button" data-rate="0.6">Lento</button>
        <button class="speedBtn active" type="button" data-rate="1.0">Normal</button>
        <button class="speedBtn" type="button" data-rate="1.6">Rápido</button>
      </div>
      <div class="numberStage">
        <div class="numberCard">
          <input id="listenInput" type="text" inputmode="numeric" autocomplete="off" placeholder="Escribe el número que escuchaste">
          <button id="confirmBtn" type="button">Confirmar</button>
        </div>
      </div>
      <div id="listenFeedback" class="feedback"></div>
      <button id="replayBtn" type="button">🔊 Escuchar de nuevo</button>
    </section>

    <!-- Result -->
    <section id="resultScreen" class="screen">
      <h2 id="resultTitle">¡Se acabó el tiempo!</h2>
      <div class="resultStats" id="resultStats"></div>
      <div class="speedBreakdown" id="speedBreakdown"></div>
      <div class="resultActions">
        <button id="retryBtn" type="button">Jugar de nuevo</button>
        <button id="menuBtn" type="button">Volver al menú</button>
      </div>
    </section>

  </main>
</div>

<script>
(function(){
  "use strict";

  /* ============ Analytics (GA4) ============ */
  function trackEvent(name, params){
    if (typeof gtag === 'function'){
      gtag('event', name, params || {});
    }
  }

  /* ============ Chinese numeral conversion (0–9999) ============ */
  const CN_DIGIT = ['零','一','二','三','四','五','六','七','八','九'];
  const CN_UNIT = ['','十','百','千'];

  function numberToChinese(n){
    if (n === 0) return '零';
    const s = String(n);
    const len = s.length;
    let result = '';
    let needZero = false;
    for (let i=0; i<len; i++){
      const d = parseInt(s[i], 10);
      const unitPos = len - i - 1;
      if (d === 0){
        needZero = true;
        continue;
      }
      if (needZero){
        result += '零';
        needZero = false;
      }
      let digitChar = CN_DIGIT[d];
      if (d === 2 && unitPos >= 2) digitChar = '兩'; // 兩百 / 兩千
      if (d === 1 && unitPos === 1 && result === '') digitChar = ''; // 十 not 一十 at the start
      result += digitChar + CN_UNIT[unitPos];
    }
    return result;
  }

  function chineseToNumber(str){
    const digitMap = {'零':0,'一':1,'二':2,'兩':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9};
    const unitMap = {'十':10,'百':100,'千':1000};
    let section = 0, num = 0, any = false;
    for (const ch of str){
      if (digitMap[ch] !== undefined){
        num = digitMap[ch];
        any = true;
      } else if (unitMap[ch] !== undefined){
        const unit = unitMap[ch];
        if (num === 0) num = 1; // "十" alone means 10
        section += num * unit;
        num = 0;
        any = true;
      }
    }
    if (!any) return null;
    return section + num;
  }

  function extractNumberFromSpeech(transcript){
    if (!transcript) return null;
    const digitMatch = transcript.match(/\d+/);
    if (digitMatch) return parseInt(digitMatch[0], 10);
    const allowed = '零一二三四五六七八九兩两十百千';
    const filtered = [...transcript].filter(ch => allowed.includes(ch)).join('');
    if (!filtered) return null;
    return chineseToNumber(filtered);
  }

  // 出題數字的位數機率：千位數 40%、百位數 45%、十位/個位數（0-99）20%
  const DIGIT_RANGES = [
    { min: 1000, max: 9999, weight: 40 },
    { min: 100, max: 999, weight: 45 },
    { min: 0, max: 99, weight: 20 },
  ];
  const DIGIT_RANGES_TOTAL = DIGIT_RANGES.reduce((sum, r) => sum + r.weight, 0);

  function pickWeightedRange(){
    let r = Math.random() * DIGIT_RANGES_TOTAL;
    for (const range of DIGIT_RANGES){
      if (r < range.weight) return range;
      r -= range.weight;
    }
    return DIGIT_RANGES[DIGIT_RANGES.length - 1];
  }

  function randomNumber(exclude){
    let n;
    do {
      const range = pickWeightedRange();
      n = range.min + Math.floor(Math.random() * (range.max - range.min + 1));
    } while (n === exclude);
    return n;
  }

  /* ============ Speech synthesis (listening mode) ============ */
  let zhVoice = null;
  function pickVoice(){
    const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
    zhVoice = voices.find(v => v.lang === 'zh-TW')
      || voices.find(v => v.lang && v.lang.toLowerCase().startsWith('zh-tw'))
      || voices.find(v => v.lang && v.lang.toLowerCase().startsWith('zh'))
      || null;
  }
  if (window.speechSynthesis){
    pickVoice();
    window.speechSynthesis.onvoiceschanged = pickVoice;
  }
  let speechRate = 1.0; // Súper Fácil 0.1 · Lento 0.6 · Normal 1.0 · Rápido 1.6
  function speak(text){
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'zh-TW';
    if (zhVoice) utter.voice = zhVoice;
    utter.rate = speechRate;
    window.speechSynthesis.speak(utter);
  }

  /* ============ Elements ============ */
  const el = id => document.getElementById(id);
  const screens = {
    menu: el('menuScreen'),
    listening: el('listeningScreen'),
    result: el('resultScreen'),
  };
  const timerBadge = el('timerBadge');
  const timerFill = el('timerFill');
  const backBtn = el('backBtn');

  function showScreen(name){
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
    backBtn.style.visibility = (name === 'menu' || name === 'result') ? 'hidden' : 'visible';
  }

  /* ============ Shared timer/session state ============ */
  const SESSION_SECONDS = 60;
  let timeLeft = SESSION_SECONDS;
  let timerInterval = null;
  let currentMode = null; // 'listening'
  let currentNumber = 0;
  let correctCount = 0;
  let wrongCount = 0;

  function updateTimerUI(){
    const m = Math.floor(timeLeft / 60);
    const s = timeLeft % 60;
    timerBadge.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    timerFill.style.width = (timeLeft / SESSION_SECONDS * 100) + '%';
    const urgent = timeLeft <= 10;
    timerBadge.classList.toggle('urgent', urgent);
    timerFill.classList.toggle('urgent', urgent);
  }

  function startTimer(){
    timeLeft = SESSION_SECONDS;
    updateTimerUI();
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeLeft--;
      updateTimerUI();
      if (timeLeft <= 0){
        clearInterval(timerInterval);
        endSession();
      }
    }, 1000);
  }

  function stopTimer(){
    clearInterval(timerInterval);
  }

  function endSession(){
    stopTimer();
    if (window.speechSynthesis) window.speechSynthesis.cancel();

    el('resultTitle').textContent = '¡Se acabó el tiempo!';
    const stats = el('resultStats');
    const breakdown = el('speedBreakdown');
    const total = correctCount + wrongCount;
    stats.innerHTML =
      statCard(correctCount, 'Correctas', 'correct') +
      statCard(wrongCount, 'Incorrectas', 'wrong') +
      statCard(total, 'Total', '');
    breakdown.style.display = 'block';
    breakdown.innerHTML = '<div class="speedBreakdownTitle">Correctas por velocidad</div>' +
      SPEED_LABELS.map(s =>
        '<div class="speedRow"><span>' + s.label + '</span><span>' + (speedCorrectCounts[s.rate] || 0) + '</span></div>'
      ).join('');
    trackEvent('game_complete', { mode: 'listening', correct: correctCount, wrong: wrongCount, total: total });
    showScreen('result');
  }

  function statCard(num, label, cls){
    return '<div class="statCard ' + cls + '"><div class="num">' + num + '</div><div class="label">' + label + '</div></div>';
  }

  function returnToMenu(){
    stopTimer();
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    showScreen('menu');
  }

  /* ============ Listening mode ============ */
  const listenInput = el('listenInput');
  const listenFeedback = el('listenFeedback');
  let listenAdvanceTimeout = null;

  const SPEED_LABELS = [
    { rate: 0.1, label: 'Súper Fácil' },
    { rate: 0.6, label: 'Lento' },
    { rate: 1.0, label: 'Normal' },
    { rate: 1.6, label: 'Rápido' },
  ];
  let speedCorrectCounts = {};
  let currentQuestionRate = 1.0;

  function startListeningMode(){
    currentMode = 'listening';
    correctCount = 0; wrongCount = 0;
    speedCorrectCounts = {};
    listenFeedback.className = 'feedback';
    listenFeedback.innerHTML = '';
    showScreen('listening');
    startTimer();
    nextListeningNumber();
  }

  function nextListeningNumber(){
    clearTimeout(listenAdvanceTimeout);
    currentNumber = randomNumber(currentNumber);
    listenInput.value = '';
    listenFeedback.className = 'feedback';
    listenFeedback.innerHTML = '';
    currentQuestionRate = speechRate;
    speak(numberToChinese(currentNumber));
    if (screens.listening.classList.contains('active')) listenInput.focus();
  }

  function submitListeningAnswer(){
    if (timeLeft <= 0) return;
    const raw = listenInput.value.trim();
    if (raw === '') return;
    const guess = parseInt(raw, 10);
    if (Number.isNaN(guess)) return;

    listenInput.blur();
    if (guess === currentNumber){
      correctCount++;
      speedCorrectCounts[currentQuestionRate] = (speedCorrectCounts[currentQuestionRate] || 0) + 1;
      listenFeedback.className = 'feedback correct';
      listenFeedback.innerHTML = '<span class="stamp">✓</span><span class="msg">¡Correcto!</span>';
    } else {
      wrongCount++;
      listenFeedback.className = 'feedback wrong';
      listenFeedback.innerHTML = '<span class="stamp">✗</span><span class="msg">Incorrecto · La respuesta correcta es ' + currentNumber + '</span>';
    }
    listenAdvanceTimeout = setTimeout(nextListeningNumber, 800);
  }

  listenInput.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    submitListeningAnswer();
  });
  el('confirmBtn').addEventListener('click', submitListeningAnswer);

  document.querySelectorAll('.speedBtn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.speedBtn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      speechRate = parseFloat(btn.dataset.rate);
      trackEvent('select_speed', { rate: speechRate, label: btn.textContent });
    });
  });

  el('replayBtn').addEventListener('click', () => {
    currentQuestionRate = speechRate;
    speak(numberToChinese(currentNumber));
    listenInput.focus();
  });

  /* ============ Nav ============ */
  el('startListening').addEventListener('click', () => {
    trackEvent('select_mode', { mode: 'listening' });
    startListeningMode();
  });
  backBtn.addEventListener('click', returnToMenu);
  el('menuBtn').addEventListener('click', returnToMenu);
  el('retryBtn').addEventListener('click', () => {
    trackEvent('replay_game', { mode: currentMode });
    startListeningMode();
  });

  trackEvent('enter_main_menu');

})();
</script>
</body>
</html>
